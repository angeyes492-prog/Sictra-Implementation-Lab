[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sictra-implementation-lab"
version = "1.2.0"
description = "Bounded, evidence-backed SICTrA Intelligence runtimes"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.unittest]
start-directory = "tests"

[tool.setuptools.package-data]
sictra_block1 = ["web/*.html", "web/*.css", "web/*.js", "web/*.png"]
sictra_block2_design = ["design_console/*.html", "design_console/*.css", "design_console/*.js", "design_console/*.svg"]
sictra_block3_precision = ["precision_console/*.html", "precision_console/*.css", "precision_console/*.js", "precision_console/*.svg"]

