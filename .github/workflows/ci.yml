name: SICTrA bounded runtime validation

on:
  pull_request:
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

concurrency:
  group: sictra-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run bounded context-to-reassessment tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Validate Design Console JavaScript
        run: node --check src/sictra_block2_design/design_console/app.js
      - name: Produce local-scope execution manifest
        env:
          PYTHONPATH: src
        run: python -m sictra_block1 tests/fixtures/notion_exp05_context_matrix.json --agent Precision
      - name: Execute eight-engine reference runtime
        env:
          PYTHONPATH: src
        run: python -m sictra_block1.demo
      - name: Execute Block 2 E01-E08 reference runtime
        env:
          PYTHONPATH: src
        run: python -m sictra_block2_design --run-at 2026-08-31T00:00:00+00:00
