name: Block 1 bounded-slice validation

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run bounded context-to-reassessment tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Produce local-scope execution manifest
        env:
          PYTHONPATH: src
        run: python -m sictra_block1 tests/fixtures/notion_exp05_context_matrix.json --agent Precision
      - name: Execute eight-engine reference runtime
        env:
          PYTHONPATH: src
        run: python -m sictra_block1.demo
